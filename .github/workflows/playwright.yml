name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test tag / grep filter (e.g. @smoke, @regression)'
        required: false
        default: ''
      project:
        description: 'Browser project to run (chromium, firefox, webkit, all)'
        required: false
        default: 'chromium'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Run E2E Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install OS Dependencies if cache hit
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright tests
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --grep \"${{ github.event.inputs.grep }}\""
          fi
          if [ -n "${{ github.event.inputs.project }}" ] && [ "${{ github.event.inputs.project }}" != "all" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --project=${{ github.event.inputs.project }}"
          fi
          npx playwright test $EXTRA_ARGS
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
